name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: gitleaks (histórico completo)
        env: { GITLEAKS_VERSION: 8.24.3 }
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dotnet:
    runs-on: ubuntu-latest   # Docker disponível para Testcontainers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # As classes de teste sobem containers em paralelo; sem a imagem local, cada uma dispara o próprio pull e o
      # Docker Hub corta por limite de requisições anônimas. Baixa uma vez só, com nova tentativa.
      - name: Imagens dos testes de integração
        run: |
          for image in postgres:17-alpine testcontainers/ryuk:0.14.0 chrislusf/seaweedfs:4.47; do
            for attempt in 1 2 3; do docker pull -q "$image" && break; sleep $((attempt * 20)); done
          done
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: test-results, path: TestResults }

  angular:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [storefront, admin]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
