# Ambiente de desenvolvimento. Produção: deploy/docker-compose.prod.yml (E1 — "Implantação na VPS").
# Uso: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Segredos ficam em deploy/.env (não versionado) — copie de deploy/.env.example.
name: ecommerce

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?defina no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina no .env}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      retries: 10

  # Storage S3 de dev (ADR-0005). SeaweedFS em modo "mini" (nó único): credencial pelas variáveis AWS_*,
  # buckets criados na primeira subida (S3_BUCKET). Docs: https://github.com/seaweedfs/seaweedfs/wiki/Quick-Start-with-weed-mini
  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?defina no .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina no .env}
      S3_BUCKET: fotos,documentos   # fotos: público (produto); documentos: privado (XML/DANFE, exportações)
    ports: ["8333:8333", "23646:23646"]   # API S3; painel de administração
    volumes: [s3data:/data]

  # E-mail de dev (RF16, Q38): servidor SMTP que não entrega nada, só guarda. Caixa em http://localhost:8025.
  # Docs: https://mailpit.axllent.org/docs/
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["127.0.0.1:8025:8025"]

  # Passo de deploy: migrações + tabelas do Wolverine, como app_migrator. API e Worker só sobem depois dele.
  migrator:
    build: { context: .., dockerfile: src/Migrator/Dockerfile }
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_migrator;Password=${APP_MIGRATOR_PASSWORD}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_migrator;Password=${APP_MIGRATOR_PASSWORD}
      Platform__Domain: ${PLATFORM_DOMAIN:-localhost}   # lojas nascem em <slug>.<domínio>
      # Só dev: loja demo (demo.localhost) com este Dono. Vazio = sem semente.
      DevSeed__OwnerEmail: ${DEV_OWNER_EMAIL:-}
      DevSeed__OwnerPassword: ${DEV_OWNER_PASSWORD:-}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: .., dockerfile: src/Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_user;Password=${APP_USER_PASSWORD:?defina no .env}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_user;Password=${APP_USER_PASSWORD}
      Vault__CurrentMasterKeyVersion: v1
      Vault__MasterKeys__v1: ${VAULT_MASTER_KEY_V1:?defina no .env}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?defina no .env}
      Storage__ServiceUrl: http://s3:8333
      Storage__AccessKey: ${S3_ACCESS_KEY}
      Storage__SecretKey: ${S3_SECRET_KEY}
      # Frete (RF14): sem Melhor Envio conectado, dev usa o provedor fake.
      Shipping__UseFakeProvider: "true"
      # Gateway de pagamento simulado (página /api/dev/pagamento-simulado). Nunca em produção.
      Payments__UseFakeGateway: "true"
      # NF-e simulada (sem valor fiscal) enquanto o adaptador da Focus NFe não entra. Nunca em produção.
      Fiscal__UseFakeProvider: "true"
      # Canal de venda simulado (webhook /api/webhooks/canais/canal-simulado) até os canais reais (E2). Nunca em produção.
      Channels__UseFakeChannel: "true"
      # DNS simulado para o domínio próprio (POST /api/dev/dns) e IP público de exemplo para o registro A. Nunca em produção.
      Dns__UseFake: "true"
      # Cobrança simulada da assinatura (RF38; página /api/dev/assinatura-simulada) até o gateway da plataforma (Q05). Nunca em produção.
      Billing__UseFakeGateway: "true"
      # Mercado Livre simulado (RF21; página /api/dev/mercado-livre/autorizar) até o app da plataforma no DevCenter. Nunca em produção.
      MercadoLivre__UseFake: "true"
      MercadoLivre__RedirectUri: http://localhost:4200/canais/mercado-livre/retorno
      # Catálogo do Instagram/Facebook simulado (Graph API em memória). Nunca em produção.
      Meta__UseFake: "true"
      # IA simulada (ADR-0003). Com chave: Ai__Provider=anthropic e Ai__Anthropic__ApiKey no .env. Nunca simulada em produção.
      Ai__Provider: ${AI_PROVIDER:-simulado}
      Ai__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Platform__PublicIps__0: 127.0.0.1
      Platform__Domain: ${PLATFORM_DOMAIN:-localhost}   # URL de notificação mostrada no painel (<slug>.<domínio>)
      Shipping__MelhorEnvio__BaseUrl: https://sandbox.melhorenvio.com.br
      Shipping__MelhorEnvio__UserAgent: ${MELHOR_ENVIO_USER_AGENT:-}
      Network__Internal__0: 172.16.0.0/12   # rede padrão do Docker: Caddy e storefront são proxies confiáveis
      # Remetente padrão da plataforma (Q38): em dev, o Mailpit.
      Email__Platform__Host: mailpit
      Email__Platform__Port: "1025"
      Email__Platform__Security: None
      Email__Platform__FromAddress: nao-responda@${PLATFORM_DOMAIN:-localhost}
    depends_on: { migrator: { condition: service_completed_successfully }, s3: { condition: service_started }, mailpit: { condition: service_started } }
    ports: ["8080:8080"]

  worker:
    build: { context: .., dockerfile: src/Worker/Dockerfile }
    environment:
      DOTNET_ENVIRONMENT: Development
      # O worker também processa notificações de pagamento da fila: precisa ver o mesmo gateway fake da API.
      Payments__UseFakeGateway: "true"
      Fiscal__UseFakeProvider: "true"
      Channels__UseFakeChannel: "true"
      # Avisos da cobrança da assinatura também são processados aqui: o mesmo gateway simulado da API.
      Billing__UseFakeGateway: "true"
      # Renovação dos acessos ao Mercado Livre roda aqui: o mesmo ML simulado da API.
      MercadoLivre__UseFake: "true"
      # Atualização do catálogo da Meta roda aqui: a mesma Graph API simulada.
      Meta__UseFake: "true"
      # Rotinas com IA (resumo diário, diagnóstico) rodam aqui: mesmo provedor da API.
      Ai__Provider: ${AI_PROVIDER:-simulado}
      Ai__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Dev: primeira reconciliação de canais 30 s depois de subir (em produção, 5 min; depois de hora em hora).
      Channels__Reconciliation__FirstRunDelay: "00:00:30"
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_user;Password=${APP_USER_PASSWORD}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_user;Password=${APP_USER_PASSWORD}
      Vault__CurrentMasterKeyVersion: v1
      Vault__MasterKeys__v1: ${VAULT_MASTER_KEY_V1:?defina no .env}
      # XML e DANFE da NF-e são gravados pela fila: o worker também escreve no storage.
      Storage__ServiceUrl: http://s3:8333
      Storage__AccessKey: ${S3_ACCESS_KEY}
      Storage__SecretKey: ${S3_SECRET_KEY}
      # E-mails ao comprador saem pela fila (qualquer processo pode enviar): mesma configuração da API.
      Platform__Domain: ${PLATFORM_DOMAIN:-localhost}
      Email__Platform__Host: mailpit
      Email__Platform__Port: "1025"
      Email__Platform__Security: None
      Email__Platform__FromAddress: nao-responda@${PLATFORM_DOMAIN:-localhost}
    depends_on: { migrator: { condition: service_completed_successfully }, mailpit: { condition: service_started } }

  storefront:
    build: { context: ../web/storefront }
    environment:
      API_URL: http://api:8080
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, storefront]

volumes:
  pgdata:
  s3data:
  caddydata:
