# Ambiente de desenvolvimento. Produção: deploy/docker-compose.prod.yml (E1 — "Implantação na VPS").
# Uso: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Segredos ficam em deploy/.env (não versionado) — copie de deploy/.env.example.
name: ecommerce

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?defina no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina no .env}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      retries: 10

  # Storage S3 de dev (ADR-0005). SeaweedFS em modo "mini" (nó único): credencial pelas variáveis AWS_*,
  # buckets criados na primeira subida (S3_BUCKET). Docs: https://github.com/seaweedfs/seaweedfs/wiki/Quick-Start-with-weed-mini
  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?defina no .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina no .env}
      S3_BUCKET: fotos,documentos   # fotos: público (produto); documentos: privado (XML/DANFE, exportações)
    ports: ["8333:8333", "23646:23646"]   # API S3; painel de administração
    volumes: [s3data:/data]

  # Passo de deploy: migrações + tabelas do Wolverine, como app_migrator. API e Worker só sobem depois dele.
  migrator:
    build: { context: .., dockerfile: src/Migrator/Dockerfile }
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_migrator;Password=${APP_MIGRATOR_PASSWORD}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_migrator;Password=${APP_MIGRATOR_PASSWORD}
      # Só dev: loja demo (demo.localhost) com este Dono. Vazio = sem semente.
      DevSeed__OwnerEmail: ${DEV_OWNER_EMAIL:-}
      DevSeed__OwnerPassword: ${DEV_OWNER_PASSWORD:-}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: .., dockerfile: src/Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_user;Password=${APP_USER_PASSWORD:?defina no .env}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_user;Password=${APP_USER_PASSWORD}
      Vault__CurrentMasterKeyVersion: v1
      Vault__MasterKeys__v1: ${VAULT_MASTER_KEY_V1:?defina no .env}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?defina no .env}
      Network__Internal__0: 172.16.0.0/12   # rede padrão do Docker: Caddy e storefront são proxies confiáveis
    depends_on: { migrator: { condition: service_completed_successfully } }
    ports: ["8080:8080"]

  worker:
    build: { context: .., dockerfile: src/Worker/Dockerfile }
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Database=plataforma;Username=app_user;Password=${APP_USER_PASSWORD}
      ConnectionStrings__Tenants: Host=postgres;Database=lojas;Username=app_user;Password=${APP_USER_PASSWORD}
      Vault__CurrentMasterKeyVersion: v1
      Vault__MasterKeys__v1: ${VAULT_MASTER_KEY_V1:?defina no .env}
    depends_on: { migrator: { condition: service_completed_successfully } }

  storefront:
    build: { context: ../web/storefront }
    environment:
      API_URL: http://api:8080
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, storefront]

volumes:
  pgdata:
  s3data:
  caddydata:
